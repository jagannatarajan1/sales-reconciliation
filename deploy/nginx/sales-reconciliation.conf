# Sales Reconciliation — nginx site.
#
# Installed to /etc/nginx/sites-available/sales-reconciliation by
# vps-bootstrap.sh, which substitutes @APP_ROOT@ and @UPLOAD_DIR@.
#
# Set server_name to your domain, then run certbot --nginx, which rewrites
# this file in place to add the TLS listener and the port 80 redirect.

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME — your domain
    server_name CHANGE-ME.example.com;

    root @APP_ROOT@/Sales-ui-sales_ui/sales-reconciliation-ui/dist;
    index index.html;

    access_log /var/log/nginx/sales-reconciliation.access.log;
    error_log  /var/log/nginx/sales-reconciliation.error.log;

    # Photo uploads: 15MB per file, up to 10 per request, plus multipart
    # overhead. Must stay at or above the API's own limits or nginx will
    # reject the request before Express can return a useful message.
    client_max_body_size 160m;

    # Phone uploads over patchy mobile data are slow; the defaults (60s) cut
    # them off mid-transfer.
    client_body_timeout 300s;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Report generation (PDF/Excel/ZIP) streams straight through rather
        # than being buffered to a temp file first.
        proxy_buffering off;
    }

    # ── Session photos ──
    # Reachable only via X-Accel-Redirect from the API, which authorises the
    # request first. `internal` means a browser cannot hit this path directly,
    # so uploaded photos are never publicly accessible by guessing a filename.
    location /_protected_uploads/ {
        internal;
        alias @UPLOAD_DIR@/;

        # These are user-supplied files: never let the browser second-guess
        # the Content-Type the API set, and never run them as active content.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # ── Static assets ──
    # Vite fingerprints filenames, so built assets can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA ──
    # index.html itself must never be cached, or clients keep loading the old
    # bundle after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Security headers ──
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
